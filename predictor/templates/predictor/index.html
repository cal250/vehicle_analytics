<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Analytics - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; background: #212529; color: white; padding-top: 20px; }
        .sidebar a { color: #adb5bd; text-decoration: none; display: block; padding: 10px 20px; }
        .sidebar a:hover { color: white; background: #343a40; }
        .sidebar a.active { color: white; background: #0d6efd; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 10px; }
        .header { background: white; padding: 15px 30px; border-bottom: 1px solid #dee2e6; margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="text-center mb-4">Vehicle Analytics</h4>
                <a href="{% url 'data_exploration' %}" class="active">Dashboard</a>
                <a href="{% url 'regression_analysis' %}">Regression</a>
                <a href="{% url 'classification_analysis' %}">Classification</a>
                <a href="{% url 'clustering_analysis' %}">Clustering</a>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 p-0">
                <div class="header d-flex justify-content-between align-items-center">
                    <h2 class="mb-0">Exploratory Data Analysis</h2>
                    <span class="text-muted">Vehicle Analytics System</span>
                </div>
                
                <div class="container-fluid px-4">
                    <!-- Plotly Map -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <div class="card p-3 shadow-sm" style="border: 1px solid #eee;">
                                {{ map_html|safe }}
                            </div>
                        </div>
                    </div>
                    
                    <!-- Data Preview -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header bg-white">
                                    <h5 class="mb-0">Dataset Preview (First 10 Rows)</h5>
                                </div>
                                <div class="card-body">
                                    <div class="table-responsive">
                                        {{ data_head|safe }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
